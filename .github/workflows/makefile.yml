name: Makefile CI

on:
  # deactivated the pipeline
  push:
    branches: [ "___main" ]
  pull_request:
    branches: [ "___main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'

    - name: Install node dependencies
      run: |
        cd ui
        npm install

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'

    - name: Build
      run:  make build

